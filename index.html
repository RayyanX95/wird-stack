<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>WirdStack — small acts, kept up daily</title>
    <meta
      name="description"
      content="WirdStack is a habit tracker built around salah. Anchor one small act to each prayer you already pray, keep it tiny, and watch the streak build."
    >
    <meta name="theme-color" content="#f3f4ef">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.svg">

    <!--
      Social preview.

      These are static on purpose and cannot be otherwise: WhatsApp, Telegram,
      X, LinkedIn and Facebook crawlers do not execute JavaScript, so they read
      exactly this markup and never see anything Vue renders. That is also the
      known limitation — an `/ar` link shared on WhatsApp gets this English
      card, because there is only one index.html. Fixing it properly needs the
      HTML varied per URL at the edge (a Cloudflare Worker with HTMLRewriter)
      or prerendering. Google is unaffected; it runs JS and reads the
      per-route tags the router maintains.

      og:image was missing entirely while twitter:card already claimed
      "summary_large_image", so every share rendered a broken, imageless card.
    -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WirdStack">
    <meta property="og:title" content="WirdStack — small acts, kept up daily">
    <meta
      property="og:description"
      content="Anchor one small act to each prayer you already pray. Free, no account, works offline."
    >
    <meta property="og:url" content="https://wird-stack.ibrahim-alrayany.workers.dev/en">
    <meta property="og:locale" content="en">
    <meta property="og:locale:alternate" content="ar">
    <!-- Absolute URL required: crawlers resolve this without a document base. -->
    <meta
      property="og:image"
      content="https://wird-stack.ibrahim-alrayany.workers.dev/og-image.png"
    >
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta
      property="og:image:alt"
      content="WirdStack — small acts, kept up daily, over an eight-point Islamic star lattice."
    >
    <meta name="twitter:card" content="summary_large_image">
    <meta
      name="twitter:image"
      content="https://wird-stack.ibrahim-alrayany.workers.dev/og-image.png"
    >

    <!--
      Theme and language, applied before first paint.

      This has to run synchronously in <head>, ahead of the stylesheet and the
      app bundle: if it waited for Vue to mount, a user who chose dark would
      get a full frame of the light palette first — the white flash that makes
      dark modes feel bolted on — and an Arabic reader would get a full frame
      of left-to-right layout before it flipped. It reads the same keys
      useTheme.ts and useLocale.ts write.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('wirdstack-theme');
          if (pref === 'dark' || pref === 'light') {
            document.documentElement.setAttribute('data-theme', pref);
          }
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0f1411');
          }
        } catch (e) {
          /* Storage blocked — the CSS media query still gives a correct theme. */
        }

        try {
          var saved = localStorage.getItem('wirdstack-locale');
          var lang =
            saved === 'ar' || saved === 'en'
              ? saved
              : (navigator.language || 'en').split('-')[0] === 'ar'
                ? 'ar'
                : 'en';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {
          /* Storage blocked — main.ts applies the detected locale on mount. */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Almarai:wght@300;400;700;800&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
