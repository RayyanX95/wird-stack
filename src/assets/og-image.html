<!--
  Source for public/og-image.png — the social preview card.

  Regenerate by rendering this file at exactly 1200x630 in a browser and
  screenshotting it, then: magick shot.png -strip -quality 92 public/og-image.png

  Rendered in a real browser rather than converted with ImageMagick on
  purpose: IM's built-in SVG renderer drops gradients, <pattern>, <tspan>
  and Arabic shaping, which was tried first and produced a black card with
  overlapping text. A browser gets the webfonts and RTL shaping right.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500&family=Reem+Kufi:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }

  .card {
    position: relative;
    width: 1200px; height: 630px;
    background: #f3f4ef;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
    font-family: 'Plus Jakarta Sans', Helvetica, sans-serif;
  }

  /* The eight-point khatim lattice from the app's own hero, as texture. */
  .lattice { position: absolute; inset: 0; opacity: 0.13; }

  /* Wash it out toward the left so the type sits on clean ground. */
  .fade {
    position: absolute; inset: 0;
    background: linear-gradient(105deg, #f3f4ef 30%, rgba(243,244,239,0.72) 62%, rgba(243,244,239,0.35) 100%);
  }

  .inner { position: relative; }

  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 44px; }
  .mark { width: 92px; height: 92px; border-radius: 21px; display: block; }
  .wordmark {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: 54px; color: #1e2a24; letter-spacing: -0.01em;
  }

  .headline {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: 82px; line-height: 1.1; color: #1e2a24; letter-spacing: -0.02em;
  }
  .headline em { font-style: italic; color: #1f6f5c; }

  .sub {
    margin-top: 30px; font-size: 27px; color: #5b6b62; font-weight: 400;
  }

  .arabic {
    position: absolute; right: 96px; bottom: 64px;
    font-family: 'Reem Kufi', sans-serif; font-size: 34px; color: #1f6f5c;
    direction: rtl;
  }
</style>
</head>
<body>
<div class="card">
  <svg class="lattice" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
    <defs>
      <g id="star">
        <polygon points="-30,-30 30,-30 30,30 -30,30" fill="none" stroke="#1f6f5c" stroke-width="1.8"/>
        <polygon points="0,-42 42,0 0,42 -42,0" fill="none" stroke="#1f6f5c" stroke-width="1.8"/>
      </g>
      <pattern id="lat" width="132" height="132" patternUnits="userSpaceOnUse">
        <use href="#star" x="66" y="66"/>
        <use href="#star" x="0" y="0"/><use href="#star" x="132" y="0"/>
        <use href="#star" x="0" y="132"/><use href="#star" x="132" y="132"/>
      </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#lat)"/>
  </svg>
  <div class="fade"></div>

  <div class="inner">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32">
        <rect width="32" height="32" fill="#1f6f5c"/>
        <polygon points="7.51,7.51 24.49,7.51 24.49,24.49 7.51,24.49" fill="#fff"/>
        <polygon points="16,4 28,16 16,28 4,16" fill="#fff"/>
        <polygon points="10.98,17.66 13.70,20.38 16.38,17.70 13.66,14.98" fill="#1f6f5c"/>
        <polygon points="16.50,20.26 21.46,14.34 18.54,11.90 13.58,17.82" fill="#1f6f5c"/>
        <circle cx="12.32" cy="16.32" r="1.9" fill="#1f6f5c"/>
        <circle cx="15.04" cy="19.04" r="1.9" fill="#1f6f5c"/>
        <circle cx="20" cy="13.12" r="1.9" fill="#1f6f5c"/>
      </svg>
      <div class="wordmark">WirdStack</div>
    </div>

    <div class="headline">Small acts,<br>kept up <em>daily</em>.</div>
    <div class="sub">Anchor one small act to each prayer you already pray.</div>
  </div>

  <div class="arabic">أعمالٌ صغيرة، تدوم كل يوم</div>
</div>
</body>
</html>
