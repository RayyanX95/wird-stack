<!--
  App mark: the eight-point khatim star with a check cut out of it.

  The star is two identical squares, one rotated 45 degrees — in Islamic
  geometry, order built from a single shape repeated; it is also the Rub el
  Hizb, the marker dividing the Qur'an into equal portions for regular daily
  recitation. Structure through repetition, which is what habit-building is.
  The check in negative space is what makes it this app's mark rather than a
  general motif: a habit kept.

  Deliberately tied to the IDEA, not the name: the app may be renamed, so no
  letterform or wordmark. Deliberately not a crescent/star, which reads as a
  generic "Muslim app" badge (and is really a national flag symbol).

  Notes for anyone adjusting this:
  - The check is built from filled polygons plus three circles faking round
    caps. It is NOT a stroked path, and tidying it into one will break the
    build: ImageMagick renders this file to favicon.ico and silently drops
    stroked paths, so the check would vanish from the .ico fallback while
    still looking correct in the SVG. Verified, not assumed.
  - Keep the whole mark SOLID. Earlier versions built from dots and hairline
    strokes all dissolved or turned muddy at 16px.
  - The two star squares share one circumradius (12). Different radii turn the
    even eight-point star into a lopsided pinwheel.
  - Don't enlarge the check much: past roughly this size its tips break the
    star's outline and the silhouette stops reading.
  - Artwork runs edge to edge with no corner radius; the browser and OS round
    the tile. Adding rx here leaves transparent corners that show as white
    notches in a browser tab.

  Mirrored in src/components/layout/AppSidebar.vue — keep the two in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#1f6f5c" />

  <polygon points="7.51,7.51 24.49,7.51 24.49,24.49 7.51,24.49" fill="#ffffff" />
  <polygon points="16,4 28,16 16,28 4,16" fill="#ffffff" />

  <polygon points="9.77,18.03 13.17,21.43 16.43,18.17 13.03,14.77" fill="#1f6f5c" />
  <polygon points="16.56,21.28 22.76,13.88 19.24,10.92 13.04,18.32" fill="#1f6f5c" />
  <circle cx="11.4" cy="16.4" r="2.3" fill="#1f6f5c" />
  <circle cx="14.8" cy="19.8" r="2.3" fill="#1f6f5c" />
  <circle cx="21" cy="12.4" r="2.3" fill="#1f6f5c" />
</svg>
